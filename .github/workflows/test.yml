name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # Unit tests only. Acceptance tests (TF_ACC) run locally against a
      # dedicated Business test org, never in CI — no live 1Password creds here.
      - run: go test ./... -count=1
